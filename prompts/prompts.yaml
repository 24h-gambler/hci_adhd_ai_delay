# 시스템 프롬프트 조합 규칙 · 버전 고정
#
# 재설계: 지연 배치 3조건 (R1/R2/R3) — docs/13-redesign-delay-placement.md
#   · 기반 프롬프트(base)는 세 조건에서 완전히 동일하다. 해시로 증명한다.
#   · 턴마다 "이번 응답의 깊이" 지시만 덧붙인다 (깊음/보통/얕음).
#   · 깊이는 (세션, 대화, 턴)으로 정해지며 사용자 입력과 무관하다.

version: "v0.3"
status: draft          # draft | pilot | locked
locked_at: null

composition:
  # 기반 = 아래를 이 순서로 "\n\n"으로 이어 붙인 것. 조건 간 동일.
  base:
    - system_common.txt
    - system_safety.txt
    - system_context.txt
  # 턴마다 기반 뒤에 하나가 덧붙는다.
  depth_deep:
    - depth_deep.txt
  depth_medium:
    - depth_medium.txt
  depth_shallow:
    - depth_shallow.txt

model:
  # ⚠️ OPEN_QUESTIONS Q18 — 최신 Claude 모델은 temperature를 거부한다.
  id: "TBD"
  temperature: 0.6
  top_p: 1.0
  max_tokens: 400      # 깊음 3~4문장을 자르지 않도록 여유. finish_reason 을 반드시 로깅
  seed: 20260401
  stream: false        # ★ 반드시 false

conversation:
  conversations: 3               # ★ 3블록이다. "6개"가 아니다
  turns_per_conversation: 9      # 깊음 3 · 보통 3 · 얕음 3
  reset_history_between_conversations: true

# 지연 배치 — 세 조건의 다중집합이 동일하다 {15,15,15,8,8,8,3,3,3} 합 78초
delay_placement:
  deep_ms:    15000
  medium_ms:   8000
  shallow_ms:  3000
  total_per_conversation_ms: 78000
  conditions:
    R1: { deep: deep_ms,    medium: medium_ms, shallow: shallow_ms }   # 깊을수록 길게
    R2: { deep: shallow_ms, medium: medium_ms, shallow: deep_ms }      # 반대
    R3: shuffled                                                       # 규칙 없음
  practice_ms: 8000              # 연습은 중앙값. 앵커가 치우치지 않게

indicator: none        # ★ 화면 표시 없음 — 넣으면 그게 해석 단서가 된다
